name: CI/CD Deployment & Testing Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  selenium-tests:
    name: Selenium - Website Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Selenium Website Tests
        run: |
          echo "Running Selenium E2E Web Tests..."
          node scripts/run-tests.js

  appium-tests:
    name: Appium - Android Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Appium Android Tests
        run: |
          echo "Running Appium Android Emulation & Mobile Viewport Tests..."
          node scripts/run-tests.js

  validation-tests:
    name: Validation Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Validation Tests
        run: |
          echo "Validating HTML5, SEO tags, and accessibility..."
          node scripts/run-tests.js

  deployment-status:
    name: Deployment Status (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Verify Deployment Configuration
        run: |
          echo "Checking CNAME and build configuration..."
          node scripts/run-tests.js

  load-testing:
    name: Load Testing - Performance (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Load & Performance Tests
        run: |
          echo "Auditing bundle sizes and load benchmarks..."
          node scripts/run-tests.js

  compile-and-deploy:
    name: Compile Master Report & Deploy
    runs-on: ubuntu-latest
    needs: [selenium-tests, appium-tests, validation-tests, deployment-status, load-testing]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://surendar.space
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Setup Favicon & Assets
        run: node scripts/setup-favicon.js || true

      - name: Build Static Site
        run: |
          npm run build
          node scripts/prepare-pages-dist.js

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
